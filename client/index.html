<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Google Fonts: Josefin Sans, DM Sans, Poppins, Arvo, Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- SEO Optimization -->
    <title>SyncStream - Discover Entertainment & Host Collaborative Watch Parties</title>
    <meta name="description" content="SyncStream is a premium global aggregation and real-time Watch Party streaming hub. Explore films, TV shows, anime, and manga. Sync video playback and chat instantly with friends." />
    <meta name="keywords" content="Watch Party, Synchronized Streaming, Live Chat, TMDB Aggregator, Anime Watchlist, Manga Reader, Jikan, MangaDex, Express, React, WebSockets" />
    <meta name="author" content="SyncStream Platform Team" />

    <!-- Open Graph (Social Sharing) -->
    <meta property="og:title" content="SyncStream - Synchronized Watch Parties" />
    <meta property="og:description" content="Stream global media and host live watch parties with synchronized playback and custom user chats." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/8/8f/Sintel_poster.jpg" />

    <!-- PWA & Mobile App Support -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SyncStream" />
  </head>
  <body class="bg-[#0f1224] overflow-x-hidden w-full max-w-full" id="syncstream-root-body">
    <!-- Main root mount point -->
    <div id="root" class="min-h-screen flex flex-col justify-between overflow-x-hidden w-full max-w-full"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch(err => console.log('SW reg error:', err));
        });
      }
    </script>
  </body>
</html>
